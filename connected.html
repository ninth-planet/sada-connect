<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>تم الربط بنجاح</title>
<style>
  body{font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;background:#0f1115;color:#e8e8ea;
       display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:1.5rem}
  main{max-width:26rem;text-align:center}
  h1{font-size:1.25rem;margin-bottom:.75rem;color:#34c759}
  p{color:#a8a8b0;line-height:1.8;font-size:.95rem}
  .handle{direction:ltr;unicode-bidi:embed;font-family:ui-monospace,Menlo,monospace;color:#e8e8ea}
</style>
</head>
<body><main><h1>تم ربط الحساب بنجاح</h1><p>تم ربط حساب <span class="handle" id="h">حسابك</span> بمنصة «الكوكب التاسع». يمكنك إغلاق هذه الصفحة الآن — سيتواصل معك فريقنا عند الحاجة.</p></main><script>
  var m = new URLSearchParams(location.search).get("h");
  if (m && /^[A-Za-z0-9_]{1,15}$/.test(m)) {
    var el = document.getElementById("h");
    if (el) el.textContent = "@" + m;
  }
</script></body>
</html>
